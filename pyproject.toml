[project]
name = "etl-pipeline"
version = "0.1.0"
description = "ETL pipeline extracting transaction data from Postgres/Redshift, transforming with pandas, and loading CSV output to Amazon S3."
requires-python = ">=3.11"
dependencies = [
    # pandas is capped below 3.0 deliberately and temporarily: pandas 3 removed
    # support for passing a raw DBAPI2 connection to pd.read_sql, which src/extract.py
    # still does with psycopg2. Lift the cap once the SQLAlchemy extract migration lands.
    "pandas>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    # Retained for one release so in-flight work keeps running; drop after the
    # SQLAlchemy/psycopg3 extract migration.
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# Application, not a distributable library: do not build/install the project itself.
package = false
